services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chalobabshakori
      POSTGRES_USER: ${DB_USER:-chalo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chalo}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-chalo} -d chalobabshakori"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/chalobabshakori
      DB_USER: ${DB_USER:-chalo}
      DB_PASSWORD: ${DB_PASSWORD:-chalo}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (at least 32 characters) in .env}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
